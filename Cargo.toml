[workspace]
resolver = "2"
members = [
    "crates/mercantile-core",
    "crates/mercantile-dex",
    "crates/mercantile-bot",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/spuddya7x/solana_rs"

[workspace.dependencies]
mercantile-core = { path = "crates/mercantile-core" }
mercantile-dex = { path = "crates/mercantile-dex" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
primitive-types = "0.13"
# solana-sdk 4.1 pulls solana-message 4.5 -> solana-address 2.7 -> wincode 0.6, which
# collides with the wincode 0.5 that the stable solana-client 4.2 line is built on.
# 4.0.1 keeps the whole graph on one wincode. Revisit when solana-client 4.3 ships.
solana-sdk = "=4.0.1"
solana-client = "=4.2.1"
spl-token = { version = "9", default-features = false, features = ["no-entrypoint"] }
spl-associated-token-account = { version = "8", default-features = false, features = ["no-entrypoint"] }
base64 = "0.22"
solana-commitment-config = "3"
solana-compute-budget-interface = "3"
solana-account-decoder-client-types = "4.2"
ureq = "3"
ctrlc = "3"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
